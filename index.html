<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>texl-editor demo</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                max-width: 48rem;
                margin: 2rem auto;
                padding: 0 1rem;
                line-height: 1.5;
            }
            #toggle {
                position: fixed;
                top: 0.75rem;
                right: 0.75rem;
                display: flex;
                padding: 0.4rem;
                border: 1px solid #ccc;
                border-radius: 0.375rem;
                background: #fff;
                color: #333;
                cursor: pointer;
            }
            #toggle:hover {
                background: #f4f4f4;
            }
            #toggle svg {
                width: 1.25rem;
                height: 1.25rem;
            }
            #toggle svg[hidden] {
                display: none;
            }
            texl-editor[hidden] {
                display: none;
            }
            pre {
                background: #f4f4f4;
                padding: 0.75rem;
                overflow: auto;
            }
        </style>
    </head>
    <body>
        <button id="toggle" type="button" title="switch to source" aria-label="switch to source">
            <svg id="icon-source" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="16 18 22 12 16 6" />
                <polyline points="8 6 2 12 8 18" />
            </svg>
            <svg id="icon-editor" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
        </button>
        <texl-editor id="editor"></texl-editor>
        <pre id="source" hidden></pre>
        <script type="module">
            import "./src/index.js";
            import sample from "./examples/sample.texl?raw";

            const editor = document.getElementById("editor");
            const source = document.getElementById("source");
            editor.value = sample;
            source.textContent = editor.value;
            editor.addEventListener("change", () => (source.textContent = editor.value));
            editor.focus();

            const toggle = document.getElementById("toggle");
            toggle.addEventListener("click", () => {
                const showSource = source.hidden;
                source.hidden = !showSource;
                editor.hidden = showSource;
                const label = showSource ? "switch to editor" : "switch to source";
                toggle.title = label;
                toggle.setAttribute("aria-label", label);
                // SVG elements have no `hidden` property: set the attribute
                document.getElementById("icon-source").toggleAttribute("hidden", showSource);
                document.getElementById("icon-editor").toggleAttribute("hidden", !showSource);
                if (!showSource) editor.focus();
            });
        </script>
    </body>
</html>
